<svg width="65" height="65" viewBox="0 0 90 70" fill="none" style="overflow:visible" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes wave-pulse {
      0%   { opacity: 0; }
      30%  { opacity: 0.9; }
      100% { opacity: 0; }
    }
    .wave {
      stroke: #C3262B;
      fill: none;
      stroke-linecap: round;
      stroke-width: 1.8;
    }
    .w1 { animation: wave-pulse 1.5s ease-out infinite 0s; }
    .w2 { animation: wave-pulse 1.5s ease-out infinite 0.3s; }
    .w3 { animation: wave-pulse 1.5s ease-out infinite 0.6s; }
    @media (prefers-reduced-motion: reduce) {
      .w1, .w2, .w3 { animation: none; opacity: 0.7; }
    }
  </style>

